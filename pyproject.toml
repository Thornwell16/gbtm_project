[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autotraj-gbtm"
version = "1.0.0"
description = "Automated Group-Based Trajectory Modeling (GBTM) engine — finite mixture models with JIT-compiled likelihood and analytical gradients."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Donald E. Warden" }]
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "numba",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
# Only needed to run the Streamlit UI (app.py) — the core engine
# (`import autotraj` or `import main`) does not require these.
ui = ["streamlit", "plotly", "matplotlib", "tableone", "openpyxl", "pyreadstat", "reportlab"]

[project.urls]
Homepage = "https://github.com/Thornwell16/gbtm_project"
Documentation = "https://github.com/Thornwell16/gbtm_project/blob/main/MATH.md"

[tool.setuptools]
py-modules = ["main"]
packages = ["autotraj"]
